name: Build and Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Ameko'
      - 'AssCS'
      - 'Holo'
      - 'Mizuki'
      - 'Tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
  push:
    branches:
      - master
    paths:
      - 'Ameko'
      - 'AssCS'
      - 'Holo'
      - 'Mizuki'
      - 'Tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'

env:
  DOTNET_VERSION: "10.0"
  ZIG_VERSION: "0.16.0"

jobs:
  calculate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      patch: ${{ steps.ver.outputs.patch }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Get version information
        id: ver
        shell: bash
        run: |
          version="$(git describe --long --abbrev=7 2>/dev/null | sed -E 's/^v//; s/([0-9]+)\.([0-9]+)\.[0-9]+-([A-Za-z0-9]+)-([0-9]+)-g/ \1.\2.\4.\3.g/; s/ //; s/-/./g' || git rev-parse --short HEAD)"
          echo Version: $version
          echo "version=$version" >> "$GITHUB_OUTPUT"

          patch="$(git describe --long --abbrev=7 | sed -E 's/^v([0-9]+)\.([0-9]+)\.[0-9]+-.+-([0-9]+)-g.*/\1.\2.\3/')"
          echo "patch=$patch" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: calculate-version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: mlugg/setup-zig@v2
        with:
          version: "${{ env.ZIG_VERSION }}"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "${{ env.DOTNET_VERSION }}.x"

      - name: Copy Dependencies
        shell: pwsh
        run: |
          $origin = "Packaging/Ameko-Native-Bin/win-x64/*"
          $lib = "Mizuki/lib"
          New-Item -ItemType Directory -Path $lib -Force | Out-Null
          Copy-Item -Path $origin -Destination $lib -Recurse -Force

      - name: Build Mizuki
        shell: pwsh
        run: |
          pushd Mizuki
          zig build -Dcpu=x86_64_v3 -Doptimize=ReleaseSafe
          popd

      - name: Build and Test Ameko
        shell: pwsh
        run: |
          dotnet build
          cp "Mizuki/zig-out/bin/mizuki.dll" "Tests/Holo.Tests/bin/Debug/net${{ env.DOTNET_VERSION }}/"
          cp -Force "Mizuki/lib/*" "Tests/Holo.Tests/bin/Debug/net${{ env.DOTNET_VERSION }}/"
          dotnet test

      - name: Publish Ameko
        shell: pwsh
        run: |
          pushd Ameko
          dotnet publish -c Release -p:SolutionDir=..\ -r win-x64 --self-contained true
          popd
          cp "Mizuki/zig-out/bin/mizuki.dll" "Ameko/bin/Release/net${{ env.DOTNET_VERSION }}/win-x64/publish"
          cp -Force "Mizuki/lib/*" "Ameko/bin/Release/net${{ env.DOTNET_VERSION }}/win-x64/publish/"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ameko-win-x64-${{ needs.calculate-version.outputs.version }}
          path: Ameko/bin/Release/net${{ env.DOTNET_VERSION }}/win-x64/publish

  build-macos:
    needs: calculate-version
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: mlugg/setup-zig@v2
        with:
          version: "${{ env.ZIG_VERSION }}"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "${{ env.DOTNET_VERSION }}.x"

      - name: Build Mizuki
        shell: bash
        run: |
          pushd Mizuki
          zig build -Dcpu=baseline -Doptimize=ReleaseSafe
          popd

      - name: Build and Test Ameko
        shell: bash
        run: |
          dotnet build
          cp "Mizuki/zig-out/lib/libmizuki.dylib" "Tests/Holo.Tests/bin/Debug/net${{ env.DOTNET_VERSION }}/"
          dotnet test

      - name: Publish Ameko
        shell: bash
        run: |
          pushd Ameko
          dotnet publish -c Release -p:SolutionDir=../ -r osx-arm64 --self-contained true
          popd
          cp "Mizuki/zig-out/lib/libmizuki.dylib" "Ameko/bin/Release/net${{ env.DOTNET_VERSION }}/osx-arm64/publish"
          chmod +x Ameko/bin/Release/net${{ env.DOTNET_VERSION }}/osx-arm64/publish/Ameko

          mkdir -p publish/Ameko.app/Contents/MacOS
          mkdir -p publish/Ameko.app/Contents/Frameworks
          mkdir -p publish/Ameko.app/Contents/Resources
          cp -a Ameko/bin/Release/net${{ env.DOTNET_VERSION }}/osx-arm64/publish/* publish/Ameko.app/Contents/MacOS
          cp -a Packaging/Ameko-Native-Bin/mac-arm64/* publish/Ameko.app/Contents/Frameworks
          cp Ameko/Assets/Icons/*.icns publish/Ameko.app/Contents/Resources

          PLIST=publish/Ameko.app/Contents/Info.plist
          cp Packaging/Info.plist $PLIST
          
          # Inject version into plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string '${{ needs.calculate-version.outputs.version }}'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string '${{ needs.calculate-version.outputs.patch }}'" "$PLIST"
          
          # Set RPath
          install_name_tool -add_rpath @executable_path/../Frameworks publish/Ameko.app/Contents/MacOS/Ameko
          
          # Ad-hoc signing
          codesign --force --deep --sign - publish/Ameko.app
          
          echo "Because Ameko is unsigned, you will need to run the following in a terminal to open Ameko: xattr -cr ./Ameko.app" > "publish/OPENING.txt"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ameko-mac-arm64-${{ needs.calculate-version.outputs.version }}
          path: publish

  build-linux:
    needs: calculate-version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: "${{ env.ZIG_VERSION }}"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "${{ env.DOTNET_VERSION }}.x"

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libass-dev \
            libffms2-dev

      - name: Build Mizuki
        shell: bash
        run: |
          pushd Mizuki
          zig build -Dcpu=x86_64_v3 -Doptimize=ReleaseSafe
          popd

      - name: Build and Test Ameko
        shell: bash
        run: |
          dotnet build
          cp "Mizuki/zig-out/lib/libmizuki.so" "Tests/Holo.Tests/bin/Debug/net${{ env.DOTNET_VERSION }}/"
          dotnet test

      - name: Publish Ameko
        shell: bash
        run: |
          pushd Ameko
          dotnet publish -c Release -p:SolutionDir=../ -r linux-x64 --self-contained true
          popd
          cp "Mizuki/zig-out/lib/libmizuki.so" "Ameko/bin/Release/net${{ env.DOTNET_VERSION }}/linux-x64/publish"
          cat << EOF > "Ameko/bin/Release/net${{ env.DOTNET_VERSION }}/linux-x64/publish/DEPENDENCIES.txt"
          You will need to install libass and ffms2 to run Ameko. Example: sudo apt install libass ffms2.
          
          Note: If video loading fails with log "Could not open video codec", you likely have an "ffmpeg-free" or similar variant installed.
          Consult your distribution's guide for installing non-free FFmpeg and/or codec support.
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ameko-linux-x64-${{ needs.calculate-version.outputs.version }}
          path: Ameko/bin/Release/net${{ env.DOTNET_VERSION }}/linux-x64/publish

  build-sdk:
    needs: calculate-version
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "${{ env.DOTNET_VERSION }}.x"
  
      - name: Build Holo and AssCS
        shell: bash
        run: dotnet build -c Release

      - name: Assemble SDK
        shell: bash
        run: |
          mkdir -p Holo.Sdk/ref
          
          cp Packaging/Holo.Sdk/Holo.Sdk.csproj Holo.Sdk/Holo.Sdk.csproj
          cp Packaging/Holo.Sdk/Holo.Sdk.slnx Holo.Sdk/Holo.Sdk.slnx
          cp Packaging/Holo.Sdk/YourScript.cs Holo.Sdk/YourScript.cs
          
          cp Holo/bin/Release/net${{ env.DOTNET_VERSION }}/Holo.dll Holo.Sdk/ref/Holo.dll
          cp Holo/bin/Release/net${{ env.DOTNET_VERSION }}/Holo.xml Holo.Sdk/ref/Holo.xml
          cp AssCS/bin/Release/net${{ env.DOTNET_VERSION }}/AssCS.dll Holo.Sdk/ref/AssCS.dll
          cp AssCS/bin/Release/net${{ env.DOTNET_VERSION }}/AssCS.xml Holo.Sdk/ref/AssCS.xml
  
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: holo-sdk-${{ needs.calculate-version.outputs.version }}
          path: Holo.Sdk